name: Feature verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: C build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make clean all
      - name: Test
        run: make test
